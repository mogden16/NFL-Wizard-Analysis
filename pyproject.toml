[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nfl_td_model"
version = "0.1.0"
description = "Point-in-time NFL anytime-touchdown research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2",
  "nflreadpy>=0.1",
  "polars>=1.0",
  "pydantic-settings>=2.0",
  "typer>=0.12",
  "httpx>=0.27",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
model = ["scikit-learn>=1.5", "lightgbm>=4.0"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
nfl-td = "nfl_td_model.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_td_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
